name: PatchLens CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint, Typing & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcapstone-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest pytest-cov types-networkx \
            fastapi uvicorn sqlalchemy alembic prometheus-client redis rq httpx

      - name: Lint and Format Check (Ruff)
        run: |
          ruff check core/ tests/ api/ benchmarks/
          ruff format --check core/ tests/ api/ benchmarks/

      - name: Strict Type Check (Mypy)
        run: |
          mypy --strict core/

      - name: Run Pytest Test Suite & Coverage
        run: |
          pytest --cov=core --cov-report=term-missing --cov-fail-under=85

  frontend-checks:
    name: Frontend Lint, Tests & Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm install

      - name: Run Vitest Component Tests
        working-directory: ./web
        run: npm run test

      - name: Build Web Application (TypeScript & Vite)
        working-directory: ./web
        run: npm run build

  e2e-integration:
    name: Playwright End-to-End Test
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcapstone-dev
          pip install --upgrade pip
          pip install -e .
          pip install fastapi uvicorn sqlalchemy alembic prometheus-client redis rq httpx playwright
          playwright install --with-deps chromium

      - name: Install and Build Frontend
        working-directory: ./web
        run: |
          npm install
          npm run build

      - name: Run E2E Test
        run: |
          python tests/test_e2e.py

