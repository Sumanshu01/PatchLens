[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchlens"
version = "0.1.0"
description = "PatchLens: Binary diffing and security patch analysis foundation for ELF binaries."
readme = "docs/part1-report.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PatchLens Engineering" }]
dependencies = [
    "pyelftools>=0.31",
    "capstone>=5.0.0",
    "networkx>=3.2",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "types-networkx>=3.2.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
patchlens = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "corpus*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["core", "corpus", "tests", "api", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["B008"]  # Allow FastAPI Depends() and File() in route signatures

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["core"]

[[tool.mypy.overrides]]
module = [
    "elftools.*",
    "capstone.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=core --cov-report=term-missing --ignore=tests/test_e2e.py"

[tool.coverage.run]
source = ["core"]
branch = false

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

